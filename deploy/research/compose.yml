name: qq-bot-research

services:
  search:
    image: searxng/searxng:2026.10.15-b00212a83@sha256:ad273460b12390ab1ad9c6ea630dafed39045ab0b9096a85ca31f5246517c670
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET:?Set a local random SearXNG signing secret in .env}"
      SEARXNG_BASE_URL: "http://127.0.0.1:8888/"
      FORCE_OWNERSHIP: "false"
      GRANIAN_WORKERS: "1"
      SEARXNG_SETTINGS_PATH: "/etc/searxng/settings.yml"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks: [search-egress, search-cache]
    depends_on:
      valkey:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128
    user: "977:977"
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777", "/var/cache/searxng:size=64m,uid=977,gid=977,mode=0700"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: none
    healthcheck:
      test: ["CMD", "/usr/local/searxng/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  valkey:
    image: valkey/valkey:8.1.3-alpine@sha256:d827e7f7552cdee40cc7482dbae9da020f42bc47669af6f71182a4ef76a22773
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [search-cache]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    read_only: true
    tmpfs: ["/data:size=8m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    user: "999:999"
    logging:
      driver: none
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  gateway:
    build:
      context: ./sidecar
      target: gateway
    image: qq-bot-research-gateway:policy-1
    restart: unless-stopped
    # The host reaches fixed /extract and /render relays here; the renderer remains internal-only.
    ports:
      - "127.0.0.1:8787:8790"
    networks: [render-private, render-egress]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: none
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  sidecar:
    build:
      context: ./sidecar
      target: sidecar
    image: qq-bot-research-sidecar:policy-1
    restart: unless-stopped
    init: true
    environment:
      RESEARCH_GATEWAY: "http://gateway:8790"
      CRAWL4AI_TELEMETRY_ENABLED: "false"
      CRAWL4AI_CHROMIUM_SANDBOX: "true"
      DO_NOT_TRACK: "1"
    # No default-route / public network. Do not attach this service to an egress network.
    networks: [render-private]
    depends_on:
      gateway:
        condition: service_healthy
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 256
    shm_size: 256m
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777", "/home/research:size=32m,uid=10001,gid=10001,mode=0700"]
    security_opt:
      - no-new-privileges:true
      - seccomp:./sidecar/seccomp_profile.json
    cap_drop: [ALL]
    logging:
      driver: none
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

networks:
  render-private:
    internal: true
  render-egress: {}
  search-egress: {}
  search-cache:
    internal: true
